name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false
          packages: platform-tools

      - name: Setup Gradle 8.13
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'
          cache-provider: basic

      - name: Run checks and unit tests
        run: gradle --no-daemon check

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Package source project
        run: |
          zip -r Nicolas-Keep-Alive-source.zip . \
            -x '.git/*' '.gradle/*' '**/build/*' 'app/build/*'

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: nicolas-keep-alive-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 90

      - name: Upload complete source ZIP
        uses: actions/upload-artifact@v4
        with:
          name: nicolas-keep-alive-source
          path: Nicolas-Keep-Alive-source.zip
          if-no-files-found: error
          retention-days: 90
